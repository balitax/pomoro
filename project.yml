name: Pomoro

# ── Swift Package Manager ────────────────────────────────────────────────────
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
  swift_case_paths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: "1.3.0"
  swift_dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.3.0"
  swift_perception:
    url: https://github.com/pointfreeco/swift-perception
    from: "1.3.0"

# ── Global Options ─────────────────────────────────────────────────────────
options:
  bundleIdPrefix: com.gus
  minimumXcodeGenVersion: "2.40.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

# ── Build Configurations ────────────────────────────────────────────────────
configs:
  Debug:   debug
  Release: release

# ── Project-level Settings ──────────────────────────────────────────────────
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""              # ← ganti dengan Team ID kamu
    CLANG_ENABLE_MODULES: "YES"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    knownRegions:
      - en
      - id

# ── Targets ─────────────────────────────────────────────────────────────────
targets:

  # ── 1. iOS App ──────────────────────────────────────────────────────────
  Pomoro_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Pomoro
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path: PomoroWidget/WidgetSharedData.swift
        group: Pomoro/Shared

    info:
      path: Pomoro/Info.plist
      properties:
        CFBundleDisplayName: Pomoro
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        BGTaskSchedulerPermittedIdentifiers:
          - com.gus.pomoro.background-sync

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gus.pomoro
        PRODUCT_NAME: Pomoro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Pomoro/Pomoro-iOS.entitlements

    dependencies:
      - target: PomoroWidget
        embed: true
        link: false
      - sdk: WidgetKit.framework
        weak: true
      - package: Supabase
        product: Supabase
      - package: ComposableArchitecture
        product: ComposableArchitecture

    swiftMacroDependencies:
      - package: ComposableArchitecture
        product: ComposableArchitectureMacros
      - package: swift_case_paths
        product: CasePathsMacros
      - package: swift_dependencies
        product: DependenciesMacrosPlugin
      - package: swift_perception
        product: PerceptionMacros

  # ── 2. Widget Extension (iOS only) ──────────────────────────────────────
  PomoroWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PomoroWidget
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"

    info:
      path: PomoroWidget/Info.plist
      properties:
        CFBundleDisplayName: PomoroWidget
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    entitlements:
      path: PomoroWidget/PomoroWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gus.pomoro

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gus.pomoro.widget
        PRODUCT_NAME: PomoroWidget
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

# ── Schemes ──────────────────────────────────────────────────────────────────
schemes:
  "Pomoro (iOS)":
    build:
      targets:
        Pomoro_iOS: all
        PomoroWidget: [build]
      parallelizeBuild: true
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
